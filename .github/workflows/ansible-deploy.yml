name: Deploy Nginx with configuration Ansible

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Get VM IP
        id: vm
        run: |
          # Cloud CLI/API se IP niklegi
          VM_IP="YOUR_VM_IP"

          echo "VM_IP=$VM_IP"
          echo "ip=$VM_IP" >> "$GITHUB_OUTPUT"

      - name: Create inventory
        run: |
          cat > inventory/prod/hosts.ini <<EOF
          [nginx]
          nginx-vm ansible_host=${{ steps.vm.outputs.ip }}

          [nginx:vars]
          ansible_user=ubuntu
          EOF

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Ansible Ping
        run: |
          ansible nginx \
            -i inventory/prod/hosts.ini \
            -m ping

      - name: Deploy Nginx
        run: |
          ansible-playbook \
            -i inventory/prod/hosts.ini \
            playbooks/nginx.yml
