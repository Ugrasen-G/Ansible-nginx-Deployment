name: Deploy Nginx to Azure VM

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read    

jobs:
  deploy:
    runs-on: ubuntu-latest
    

    steps:

      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Azure login
      - name: Azure Login
        uses: azure/login@v2
        with:
           client-id: ${{ secrets.AZURE_CLIENT_ID }}
           tenant-id: ${{ secrets.AZURE_TENANT_ID }}
           subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Install Ansible temporarily
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      # 4. Get Azure VM Public IP
      - name: Get VM IP
        id: vm1
        run: |

          VM_IP=$(az vm show \
            --show-details \
            --resource-group "kp2" \
            --name "frontend-vm1" \
            --query publicIps \
            --output tsv)

          echo "VM IP: $VM_IP"

          echo "ip=$VM_IP" >> "$GITHUB_OUTPUT"


    # 5. Get Azure VM Public IP
      - name: Get VM IP
        id: vm2
        run: |

          VM_IP=$(az vm show \
            --show-details \
            --resource-group "kp2" \
            --name "frontend-vm2" \
            --query publicIps \
            --output tsv)

          echo "VM IP: $VM_IP"

          echo "ip=$VM_IP" >> "$GITHUB_OUTPUT"


      # 6. Configure SSH
      - name: Configure SSH
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.AZURE_VM_SSH_KEY }}" \
            > ~/.ssh/azure_vm_key

          chmod 600 ~/.ssh/azure_vm_key


      
      # 7. Create dynamic Ansible inventory
      - name: Create Inventory
        env:
          VM1_IP: ${{ steps.vm1.outputs.ip }}
          VM2_IP: ${{ steps.vm2.outputs.ip }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |


          cat > inventory/dev/hosts.ini <<EOF

          [nginx]
          frontend-vm1 ansible_host=${VM1_IP}
          frontend-vm2 ansible_host=${VM2_IP}

          [nginx:vars]
          ansible_user=${{ secrets.AZURE_VM_USER }}
          ansible_ssh_private_key_file=~/.ssh/azure_vm_key

          EOF

          cat inventory/dev/hosts.ini
     # Debug Inventory
      # - name: Debug inventory
      #   run: |
      #     echo "===== INVENTORY ====="
      #     cat inventory/dev/hosts.ini

      #     echo "===== ANSIBLE INVENTORY ====="
      #     ansible-inventory -i inventory/dev/hosts.ini --host nginx-vm

      # 8. Test connection
      - name: Run Ansible Ad-hoc Ping
        run: |
          ansible nginx -i inventory/dev/hosts.ini -m ping

      # 9. Deploy Nginx
      - name: Deploy Nginx
        run: |
          ansible-playbook \
            -i inventory/dev/hosts.ini \
            playbooks/nginx.yml
